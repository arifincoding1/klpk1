<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Music Graph</title>
  <link rel="stylesheet" href="tugas.css">
</head>
<body>

<div id="wrapper">
  <h1>🎧 Music Graph</h1>
  <button onclick="enterApp()">Masuk</button>
</div>

<div id="app" style="display:none;">
  <h2 id="current-song">-</h2>

  <audio id="audio" controls></audio>

  <br>
  <button onclick="prevSong()">⏮</button>
  <button onclick="togglePlay()">⏯</button>
  <button onclick="nextSongGraph()">⏭</button>

  <div id="graph-toolkit"></div>
  <div id="graph-result"></div>
</div>

<script src="alllin.js"></script>
</body>
</html>
